<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>ScheduleAI</title>
    <!-- Source Serif 4 is the whole design: this system sets its interface
         chrome in the serif rather than pairing a serif with a sans. Linked
         rather than @import-ed inside the stylesheet so it is discovered in
         the initial HTML parse instead of after the CSS has been fetched.
         `display=swap` so the text is readable while it loads -- the fallback
         is a system serif, so the reflow is small. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
